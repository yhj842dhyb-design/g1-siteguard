<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>G1 SiteGuard · ניהול מוצר</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{ --ink:#111B29; --navy:#22395A; --navy3:#18304D; --cyan:#1AACE3; --cyanS:#0A7FBF; --bg:#F2F3F5; --line:#E1E5EA; --muted:#5B6B7E; --ok:#0F8A5F; --bad:#C2362B; --warn:#8A5A12;
  --grad:linear-gradient(135deg,#1FA6E2 0%,#0A63C2 55%,#0047A6 100%); --hair:linear-gradient(90deg,#5DD9E6,#1FA6E2 42%,#0050B4); --r:18px; }
*{ box-sizing:border-box } html,body{ margin:0 } body{ background:var(--bg); color:var(--ink); font:15px/1.55 'Heebo','Segoe UI',Arial,sans-serif; }
button,input,select,textarea{ font:inherit; color:inherit }
[hidden]{ display:none !important }
header{ background:#fff; position:sticky; top:0; z-index:20; box-shadow:0 1px 0 var(--line) }
header::after{ content:''; position:absolute; inset-inline:0; bottom:-3px; height:3px; background:var(--hair) }
.hd{ max-width:1180px; margin:auto; padding:12px 18px; display:flex; align-items:center; gap:12px }
.hd img{ width:44px; height:48px; object-fit:contain; filter:drop-shadow(0 3px 6px rgba(17,27,41,.18)) }
.hd b{ font-size:18px; font-weight:800; display:block } .hd small{ color:var(--muted); font-size:12.5px }
.hd .who{ margin-inline-start:auto; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted) }
.pill{ display:inline-flex; align-items:center; gap:6px; background:var(--navy); color:#fff; border-radius:9px; padding:3px 10px; font-size:12.5px; font-weight:700 }
main{ max-width:1180px; margin:auto; padding:22px 18px 120px }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:#fff; font-weight:700; cursor:pointer; text-decoration:none; color:var(--navy) }
.btn:hover{ border-color:#C9D2DC; background:#F7F9FB } .btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{ outline:3px solid rgba(26,172,227,.45); outline-offset:2px }
.btn.primary{ background:var(--grad); color:#fff; border:0; box-shadow:0 10px 22px rgba(0,80,180,.22) } .btn.primary:hover{ filter:brightness(1.06) }
.btn.navy{ background:var(--navy); color:#fff; border-color:var(--navy) } .btn.danger{ color:var(--bad); border-color:rgba(194,54,43,.35) } .btn.sm{ min-height:34px; padding:0 11px; font-size:13px; border-radius:10px }
.btn:disabled{ opacity:.55; cursor:not-allowed }
.card{ background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:20px; box-shadow:0 10px 28px rgba(17,27,41,.05) }
h1{ font-size:26px; font-weight:900; margin:0 0 4px } h2{ font-size:19px; font-weight:800; margin:0 0 6px } h3{ font-size:15.5px; font-weight:800; margin:18px 0 8px }
.sub{ color:var(--muted); margin:0 0 16px; font-size:14px }
/* login */
.login{ min-height:calc(100vh - 80px); display:grid; place-items:center; padding:20px }
.login .card{ width:min(440px,100%); text-align:center; display:flex; flex-direction:column; gap:10px; padding:28px 26px }
.hex{ width:64px; height:72px; margin:0 auto; display:grid; place-items:center; color:#fff; background:linear-gradient(150deg,#1A8FCB,#0D5F92); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%) }
.code-in{ font:700 20px/1.2 ui-monospace,Consolas,monospace; letter-spacing:2px; text-align:center; padding:12px; border:1.5px solid #C9D2DC; border-radius:12px; text-transform:uppercase; width:100% }
.err{ color:var(--bad); font-weight:700; font-size:13.5px; min-height:20px }
/* tabs */
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 18px }
.tab{ border:0; background:#DCE1E7; color:#3F4C5B; border-radius:12px; padding:10px 16px; font-weight:800; cursor:pointer }
.tab[aria-selected=true]{ background:var(--navy); color:#fff; box-shadow:0 8px 18px rgba(34,57,90,.25) }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px }
.stat{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px }
.stat b{ display:block; font-size:30px; font-weight:900; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.1 }
.stat span{ color:var(--muted); font-size:13px }
table{ width:100%; border-collapse:collapse } th,td{ text-align:start; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle } th{ font-size:12px; color:var(--muted); font-weight:700 }
.tbl-wrap{ overflow-x:auto }
td input[type=number], td input[type=text], .f input, .f select, .f textarea{ width:100%; padding:8px 10px; border:1px solid #C9D2DC; border-radius:10px; background:#fff }
td input[type=number]{ max-width:120px; text-align:center; font-variant-numeric:tabular-nums }
.st{ display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:13px; border-radius:99px; padding:2px 10px }
.st.on{ background:rgba(15,138,95,.12); color:var(--ok) } .st.off{ background:rgba(194,54,43,.1); color:var(--bad) }
.role{ font-size:12px; font-weight:800; color:var(--cyanS) }
.f{ display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:700 } .f small{ font-weight:500; color:var(--muted) }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.sw{ display:inline-flex; align-items:center; gap:10px; cursor:pointer; font-weight:700 }
.sw input{ -webkit-appearance:none; appearance:none; width:46px; height:28px; border-radius:99px; background:#C9D1DA; position:relative; cursor:pointer; transition:background .2s; flex:none }
.sw input::after{ content:''; position:absolute; top:3px; inset-inline-start:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:inset-inline-start .2s }
.sw input:checked{ background:var(--navy) } .sw input:checked::after{ inset-inline-start:21px }
.note{ background:#F7F9FB; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:13.5px; color:#33404F }
.note.warn{ background:#FFF7EA; border-color:#F0D9B0; color:var(--warn) }
.cat-h td{ background:#F7F9FB; font-weight:800; font-size:13px; color:var(--navy) }
.pubbar{ position:fixed; inset-inline:0; bottom:0; z-index:30; background:rgba(255,255,255,.97); backdrop-filter:blur(8px); box-shadow:0 -10px 24px -12px rgba(17,27,41,.3); padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)) }
.pubbar .in{ max-width:1180px; margin:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap }
.pubbar .msg{ font-weight:700; color:var(--navy) } .pubbar .msg.dirty{ color:var(--warn) }
.pubbar .sp{ flex:1 }
.modal-bd{ position:fixed; inset:0; z-index:50; background:rgba(17,27,41,.55); display:grid; place-items:center; padding:18px }
.modal{ width:min(520px,100%); background:#fff; border-radius:22px; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.35); max-height:90vh; overflow:auto }
.code-big{ font:800 28px/1.2 ui-monospace,Consolas,monospace; letter-spacing:3px; text-align:center; padding:14px; background:#0B1F33; color:#fff; border-radius:14px; direction:ltr; margin:10px 0 }
.toast{ position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:#0B1F33; color:#fff; padding:10px 18px; border-radius:12px; font-weight:700; z-index:60; box-shadow:0 12px 28px rgba(0,0,0,.3) }
.mono{ font-family:ui-monospace,Consolas,monospace; direction:ltr; unicode-bidi:isolate }
ol.steps{ margin:6px 0 0; padding-inline-start:20px; line-height:1.9 }
@media (max-width:640px){ .hd .who span.n{ display:none } h1{ font-size:22px } td,th{ padding:8px 5px } }
</style>
</head>

    var text = 'שלום ' + u.name + ',\nזה קוד הכניסה האישי שלך לאפליקציית G1 SiteGuard (פיילוט חטיבת המוקדים):\n' + code + '\n\nהאפליקציה: ' + APP_URL + 'get/\nאת הקוד מזינים אחרי בחירת סוג הפרויקט. נא לא להעביר אותו לאחרים.';
    modal('<h2>' + (isNew ? 'המשתמש נוסף' : 'קוד חדש נוצר') + ' · ' + esc(u.name) + '</h2>' +
      '<p class="sub" style="margin:4px 0 0">הקוד מוצג רק עכשיו. העבירו אותו למשתמש, ואז לחצו "פרסום לכל המשתמשים" כדי שייכנס לתוקף.</p>' +
      '<div class="code-big" id="cb">' + code + '</div>' +
      '<div class="row" style="justify-content:center"><button class="btn" id="cpy">העתקת הקוד</button>' +
      '<a class="btn navy" target="_blank" rel="noopener" href="https://wa.me/' + (phone || '') + '?text=' + encodeURIComponent(text) + '">שליחה בוואטסאפ</a></div>' +
      '<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" data-x>סיימתי</button></div>', function(bd){
      bd.querySelector('#cpy').onclick = function(){ (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(function(){ toast('הקוד הועתק'); }).catch(function(){ toast('סמנו והעתיקו ידנית'); }); };
    });
  });
}
function modal(html, init){
  var bd = document.createElement('div'); bd.className = 'modal-bd'; bd.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>'; document.body.appendChild(bd);
  Array.prototype.forEach.call(bd.querySelectorAll('[data-x]'), function(b){ b.onclick = function(){ bd.remove(); }; });
  bd.addEventListener('keydown', function(e){ if (e.key === 'Escape') bd.remove(); });
  if (init) init(bd); return bd;
}

function rAgent(){
  var P = cfg.agent.prices, C = cfg.agent.cablePrices;
  var byCat = {}; DEV.forEach(function(d){ (byCat[d.cat] = byCat[d.cat] || []).push(d); });
  var rows = Object.keys(CAT).filter(function(c){ return byCat[c]; }).map(function(c){
    return '<tr class="cat-h"><td colspan="3">' + CAT[c] + '</td></tr>' + byCat[c].map(function(d){ var p = P[d.t] || {};
      return '<tr><td>' + esc(d.label) + '</td><td><input type="number" min="0" class="ap" data-k="' + d.t + '" data-f="list" value="' + (p.list != null ? p.list : '') + '" aria-label="מחיר מחירון ' + esc(d.label) + '"></td>' +
        '<td><input type="number" min="0" class="ap" data-k="' + d.t + '" data-f="min" value="' + (p.min != null ? p.min : '') + '" aria-label="מחיר מינימום ' + esc(d.label) + '"></td></tr>'; }).join('');
  }).join('');
  $('#pane').innerHTML = '<h1>אפליקציית הסוכנים · מחירים</h1><p class="sub">מחיר מחירון נכנס אוטומטית להצעת המחיר. מחיר מינימום — אי אפשר לשלוח או לשמור הצעה מתחת לו, גם לא אחרי הנחה. שדה ריק = הסוכן קובע בעצמו.</p>' +
    '<div class="card"><div class="grid2"><label class="f">הנחה מקסימלית בהצעה (%)<input type="number" id="maxDisc" min="0" max="100" value="' + (cfg.agent.maxDiscountPct != null ? cfg.agent.maxDiscountPct : '') + '"><small>ריק = ללא הגבלה</small></label></div></div>' +
    '<div class="card" style="margin-top:14px"><h2>ציוד (ליחידה, ₪ כולל מע״מ)</h2><div class="tbl-wrap"><table><thead><tr><th>פריט</th><th>מחיר מחירון</th><th>מחיר מינימום</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    '<div class="card" style="margin-top:14px"><h2>כבילה (למטר)</h2><div class="tbl-wrap"><table><thead><tr><th>סוג כבל</th><th>מחיר מחירון</th><th>מחיר מינימום</th></tr></thead><tbody>' +
      CABLES.map(function(c){ var p = C[c[0]] || {}; return '<tr><td>' + c[1] + '</td><td><input type="number" min="0" step="0.1" class="ac" data-k="' + c[0] + '" data-f="list" value="' + (p.list != null ? p.list : '') + '"></td><td><input type="number" min="0" step="0.1" class="ac" data-k="' + c[0] + '" data-f="min" value="' + (p.min != null ? p.min : '') + '"></td></tr>'; }).join('') +
    '</tbody></table></div></div>';
  function bindP(sel, T){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(inp){ inp.oninput = function(){
    var k = inp.dataset.k, f = inp.dataset.f, v = inp.value.trim(); T[k] = T[k] || {}; T[k][f] = v === '' ? null : Number(v);
    if (T[k].list == null && T[k].min == null) delete T[k];
    var row = inp.closest('tr'), l = row.querySelector('[data-f=list]'), m = row.querySelector('[data-f=min]');
    var bad = l.value !== '' && m.value !== '' && Number(m.value) > Number(l.value); m.style.borderColor = bad ? 'var(--bad)' : ''; m.title = bad ? 'מחיר המינימום גבוה ממחיר המחירון' : '';
    markDirty(); }; }); }
  bindP('.ap', P); bindP('.ac', C);
  $('#maxDisc').oninput = function(){ var v = this.value.trim(); cfg.agent.maxDiscountPct = v === '' ? null : Math.max(0, Math.min(100, Number(v))); markDirty(); };
}

function rConsumer(){
  var c = cfg.consumer, P = c.prices;
  function num(id, label, val, hint){ return '<label class="f">' + label + '<input type="number" min="0" id="' + id + '" value="' + (val != null ? val : '') + '">' + (hint ? '<small>' + hint + '</small>' : '') + '</label>'; }
  $('#pane').innerHTML = '<h1>אפליקציית הלקוחות</h1><p class="sub">המחירים והתנאים שהלקוח רואה במתכנן האזעקה האלחוטית (כולל מע״מ). החבילות מחושבות אוטומטית מהמחירים האלה.</p>' +
    '<div class="card"><h2>מחירי אביזרים</h2><div class="tbl-wrap"><table><thead><tr><th>אביזר</th><th>מחיר ללקוח (₪)</th></tr></thead><tbody>' +
      CONS.map(function(x){ return '<tr><td>' + x[1] + '</td><td><input type="number" min="0" class="cp" data-k="' + x[0] + '" value="' + (P[x[0]] != null ? P[x[0]] : '') + '"></td></tr>'; }).join('') +
    '</tbody></table></div></div>' +
    '<div class="card" style="margin-top:14px"><h2>התקנה, מוקד ותנאים</h2><div class="grid2">' +
      num('cTech', 'התקנה ע״י טכנאי מוסמך (₪)', c.techInstall, 'כולל אחריות לשנה') + num('cPre', 'מערכת מוגדרת מראש (₪)', c.preprog) +
      num('cMon', 'חיבור למוקד (₪ לחודש)', c.monitoring) + num('cFree', 'חודשי מוקד מתנה בהתקנת טכנאי', c.monitoringFreeMonths) +
      num('cDel', 'זמן אספקה (ימי עסקים)', c.deliveryDays) + num('cRet', 'ימים להחזרה', c.returnDays) + num('cSign', 'שלטי "מקום זה מוגן" מתנה (מקסימום)', c.signMax) +
      '<label class="f">וואטסאפ המכירות<input type="text" class="mono" id="cWa" value="' + esc(c.salesWhatsapp || '') + '" placeholder="972501234567"><small>מספר בינלאומי, בלי + — מוצג ללקוח לפנייה מהירה</small></label>' +
      '<label class="f">כתובת לקליטת הזמנות (טופס הלידים)<input type="text" class="mono" id="cLead" value="' + esc(c.leadEndpoint || '') + '" placeholder="https://..."><small>ריק = מצב הדגמה (ההזמנות לא נשלחות)</small></label>' +
    '</div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('.cp'), function(inp){ inp.oninput = function(){ var v = inp.value.trim(); if (v === '') delete P[inp.dataset.k]; else P[inp.dataset.k] = Number(v); markDirty(); }; });
  [['cTech','techInstall'],['cPre','preprog'],['cMon','monitoring'],['cFree','monitoringFreeMonths'],['cDel','deliveryDays'],['cRet','returnDays'],['cSign','signMax']].forEach(function(p){
    $('#' + p[0]).oninput = function(){ var v = this.value.trim(); c[p[1]] = v === '' ? null : Number(v); markDirty(); };
  });
  $('#cWa').oninput = function(){ c.salesWhatsapp = this.value.replace(/\D/g, ''); markDirty(); };
  $('#cLead').oninput = function(){ c.leadEndpoint = this.value.trim(); markDirty(); };
}

function rPublish(){
  var t = token();
  $('#pane').innerHTML = '<h1>פרסום וגיבוי</h1><p class="sub">עמוד הניהול שומר את ההגדרות בקובץ אחד באתר. חיבור חד-פעמי ל-GitHub מאפשר לפרסם מכל מחשב שבו עשיתם את החיבור.</p>' +
    '<div class="card"><h2>חיבור ל-GitHub ' + (t ? '<span class="st on">מחובר</span>' : '<span class="st off">לא מחובר</span>') + '</h2>' +
      '<ol class="steps"><li>היכנסו ל-<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">יצירת מפתח גישה ב-GitHub</a> (בחשבון שמנהל את האתר).</li>' +
      '<li>שם: "G1 admin". תוקף: לבחירתכם (למשל שנה).</li>' +
      '<li>Repository access: <b>Only select repositories</b> ← <span class="mono">g1-siteguard</span>.</li>' +
      '<li>Permissions ← Repository permissions ← <b>Contents: Read and write</b>.</li>' +
      '<li>Generate token, העתיקו והדביקו כאן:</li></ol>' +
      '<div class="row" style="margin-top:10px"><input type="password" id="tok" class="mono" placeholder="github_pat_…" style="flex:1;min-width:220px;padding:10px;border:1px solid #C9D2DC;border-radius:10px" value="' + esc(t) + '" autocomplete="off">' +
      '<button class="btn navy" id="tokSave">שמירה ובדיקה</button>' + (t ? '<button class="btn danger" id="tokDel">ניתוק</button>' : '') + '</div>' +
      '<div class="note" style="margin-top:10px">המפתח נשמר רק בדפדפן של המחשב הזה ומשמש רק לעדכון קובץ ההגדרות. אל תשתפו אותו.</div></div>' +
    '<div class="card" style="margin-top:14px"><h2>גיבוי</h2><p class="sub" style="margin:0 0 10px">שמירת עותק של כל ההגדרות לקובץ במחשב, או שחזור מעותק כזה (השחזור נכנס כטיוטה — צריך לפרסם).</p>' +
      '<div class="row"><button class="btn" id="bkDown">הורדת גיבוי</button><label class="btn" for="bkUp">שחזור מגיבוי</label><input type="file" id="bkUp" accept="application/json,.json" hidden></div></div>';
  $('#tokSave').onclick = function(){
    var v = $('#tok').value.trim(); if (!v) return; lsSet('g1sg_admin_token', v);
    gh('GET').then(function(j){ sha = j.sha; toast('החיבור תקין — אפשר לפרסם'); rPublish(); })
      .catch(function(e){ lsSet('g1sg_admin_token', null); toast(e.status === 401 ? 'המפתח לא תקין' : e.status === 404 ? 'למפתח אין גישה למאגר g1-siteguard' : ('שגיאה: ' + e.message)); rPublish(); });
  };
  var td = $('#tokDel'); if (td) td.onclick = function(){ lsSet('g1sg_admin_token', null); sha = null; rPublish(); };
  $('#bkDown').onclick = function(){ var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 1)], { type:'application/json' })); a.download = 'g1-siteguard-config-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); };
  $('#bkUp').onchange = function(){ var f = this.files[0]; if (!f) return; f.text().then(function(t){ var c = JSON.parse(t); if (!c.access || !c.consumer) throw new Error(); var keepSalt = cfg.access.salt; cfg = c; if (!cfg.access.salt) cfg.access.salt = keepSalt; toast('הגיבוי נטען — בדקו ופרסמו'); render(); }).catch(function(){ toast('קובץ גיבוי לא תקין'); }); };
}

/* ---------- publish ---------- */
$('#btnDiscard').onclick = function(){ if (!confirm('לבטל את כל השינויים שלא פורסמו?')) return; cfg = clone(saved); render(); };
$('#btnPublish').onclick = function(){
  if (!token()) { tab = 'publish'; document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected', String(x.dataset.t === 'publish')); }); render(); toast('קודם מחברים את עמוד הניהול ל-GitHub'); return; }
  if (activeManagers() < 1) { toast('חייב להישאר לפחות מנהל מוצר פעיל אחד'); return; }
  var mine = (cfg.access.users || []).filter(function(u){ return u.id === me.id; })[0];
  if (!mine || mine.status !== 'active' || mine.hash !== me.hash) { if (!confirm('השינוי ינעל את הכניסה שלך עם הקוד הנוכחי. להמשיך?')) return; }
  var b = this; b.disabled = true; b.textContent = 'מפרסם…';
  cfg.updatedAt = new Date().toISOString(); cfg.updatedBy = me.name;
  var body = JSON.stringify(cfg, null, 1);
  gh('GET').then(function(j){ return gh('PUT', { message:'admin: settings update by ' + me.name, content:b64(body), sha:j.sha, branch:REPO.branch }); })
    .then(function(r){ sha = r.content && r.content.sha; saved = clone(cfg); markDirty(); toast('פורסם! המשתמשים יקבלו את העדכון תוך כדקה–שתיים'); render(); })
    .catch(function(e){ toast(e.status === 401 || e.status === 403 ? 'אין הרשאה — בדקו את החיבור ל-GitHub' : ('הפרסום נכשל: ' + e.message)); })
    .then(function(){ b.textContent = 'פרסום לכל המשתמשים'; markDirty(); });
};
})();
</script>
</body>
