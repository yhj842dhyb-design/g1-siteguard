<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>G1 SiteGuard · ניהול מוצר</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{ --ink:#111B29; --navy:#22395A; --navy3:#18304D; --cyan:#1AACE3; --cyanS:#0A7FBF; --bg:#F2F3F5; --line:#E1E5EA; --muted:#5B6B7E; --ok:#0F8A5F; --bad:#C2362B; --warn:#8A5A12;
  --grad:linear-gradient(135deg,#1FA6E2 0%,#0A63C2 55%,#0047A6 100%); --hair:linear-gradient(90deg,#5DD9E6,#1FA6E2 42%,#0050B4); --r:18px; }
*{ box-sizing:border-box } html,body{ margin:0 } body{ background:var(--bg); color:var(--ink); font:15px/1.55 'Heebo','Segoe UI',Arial,sans-serif; }
button,input,select,textarea{ font:inherit; color:inherit }
[hidden]{ display:none !important }
header{ background:#fff; position:sticky; top:0; z-index:20; box-shadow:0 1px 0 var(--line) }
header::after{ content:''; position:absolute; inset-inline:0; bottom:-3px; height:3px; background:var(--hair) }
.hd{ max-width:1180px; margin:auto; padding:12px 18px; display:flex; align-items:center; gap:12px }
.hd img{ width:44px; height:48px; object-fit:contain; filter:drop-shadow(0 3px 6px rgba(17,27,41,.18)) }
.hd b{ font-size:18px; font-weight:800; display:block } .hd .hd-t{ display:flex; align-items:center; gap:10px } .hd .hd-word{ width:auto; height:22px; filter:none } .hd .hd-t span{ font-size:15px; color:var(--muted); font-weight:700; border-inline-start:1px solid var(--line); padding-inline-start:10px } .hd small{ color:var(--muted); font-size:12.5px }
.hd .who{ margin-inline-start:auto; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted) }
.pill{ display:inline-flex; align-items:center; gap:6px; background:var(--navy); color:#fff; border-radius:9px; padding:3px 10px; font-size:12.5px; font-weight:700 }
main{ max-width:1180px; margin:auto; padding:22px 18px 120px }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:#fff; font-weight:700; cursor:pointer; text-decoration:none; color:var(--navy) }
.btn:hover{ border-color:#C9D2DC; background:#F7F9FB } .btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{ outline:3px solid rgba(26,172,227,.45); outline-offset:2px }
.btn.primary{ background:var(--grad); color:#fff; border:0; box-shadow:0 10px 22px rgba(0,80,180,.22) } .btn.primary:hover{ filter:brightness(1.06) }
.btn.navy{ background:var(--navy); color:#fff; border-color:var(--navy) } .btn.danger{ color:var(--bad); border-color:rgba(194,54,43,.35) } .btn.sm{ min-height:34px; padding:0 11px; font-size:13px; border-radius:10px }
.btn:disabled{ opacity:.55; cursor:not-allowed }
.card{ background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:20px; box-shadow:0 10px 28px rgba(17,27,41,.05) }
h1{ font-size:26px; font-weight:900; margin:0 0 4px } h2{ font-size:19px; font-weight:800; margin:0 0 6px } h3{ font-size:15.5px; font-weight:800; margin:18px 0 8px }
.sub{ color:var(--muted); margin:0 0 16px; font-size:14px }
/* login */
.login{ min-height:calc(100vh - 80px); display:grid; place-items:center; padding:20px }
.login .card{ width:min(440px,100%); text-align:center; display:flex; flex-direction:column; gap:10px; padding:28px 26px }
.hex{ width:64px; height:72px; margin:0 auto; display:grid; place-items:center; color:#fff; background:linear-gradient(150deg,#1A8FCB,#0D5F92); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%) }
.code-in{ font:700 20px/1.2 ui-monospace,Consolas,monospace; letter-spacing:2px; text-align:center; padding:12px; border:1.5px solid #C9D2DC; border-radius:12px; text-transform:uppercase; width:100% }
.err{ color:var(--bad); font-weight:700; font-size:13.5px; min-height:20px }
/* tabs */
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 18px }
.tab{ border:0; background:#DCE1E7; color:#3F4C5B; border-radius:12px; padding:10px 16px; font-weight:800; cursor:pointer }
.tab[aria-selected=true]{ background:var(--navy); color:#fff; box-shadow:0 8px 18px rgba(34,57,90,.25) }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px }
.stat{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px }
.stat b{ display:block; font-size:30px; font-weight:900; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.1 }
.stat span{ color:var(--muted); font-size:13px }
table{ width:100%; border-collapse:collapse } th,td{ text-align:start; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle } th{ font-size:12px; color:var(--muted); font-weight:700 }
.tbl-wrap{ overflow-x:auto }
td input[type=number], td input[type=text], .f input, .f select, .f textarea{ width:100%; padding:8px 10px; border:1px solid #C9D2DC; border-radius:10px; background:#fff }
td input[type=number]{ max-width:120px; text-align:center; font-variant-numeric:tabular-nums }
.st{ display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:13px; border-radius:99px; padding:2px 10px }
.st.on{ background:rgba(15,138,95,.12); color:var(--ok) } .st.off{ background:rgba(194,54,43,.1); color:var(--bad) }
.role{ font-size:12px; font-weight:800; color:var(--cyanS) }
.f{ display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:700 } .f small{ font-weight:500; color:var(--muted) }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.tx-f.tx-ch input,.tx-f.tx-ch textarea{ border-color:var(--cyanS); background:#F2FAFE } .tx-l{ display:flex; align-items:center; justify-content:space-between; gap:8px } .tx-reset{ border:0; background:none; color:var(--cyanS); font-weight:700; cursor:pointer; font-size:12px; padding:0 } .tx-f textarea{ width:100%; padding:9px; border:1px solid #C9D2DC; border-radius:10px; font:inherit; resize:vertical } .tx-dev{ border-top:1px solid var(--line); padding:12px 0 } .tx-dev:first-of-type{ border-top:0 } .tx-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px 14px; align-items:start } .tx-dev-h{ display:flex; gap:8px; align-items:baseline; margin-bottom:6px } .tx-dev-h small{ color:var(--muted) }
.st.pend{ background:#FFF4D6; color:#8A5A12 }
.cf-opt{ display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer; font-weight:500 } .cf-opt:has(input:checked){ border-color:var(--navy); background:#F3F6FA; box-shadow:inset 0 0 0 1px var(--navy) } .cf-opt input{ width:18px; height:18px; accent-color:var(--navy); flex:none; margin:0 }
.sw{ display:inline-flex; align-items:center; gap:10px; cursor:pointer; font-weight:700 }
.sw input{ -webkit-appearance:none; appearance:none; width:46px; height:28px; border-radius:99px; background:#C9D1DA; position:relative; cursor:pointer; transition:background .2s; flex:none }
.sw input::after{ content:''; position:absolute; top:3px; inset-inline-start:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:inset-inline-start .2s }
.sw input:checked{ background:var(--navy) } .sw input:checked::after{ inset-inline-start:21px }
.note{ background:#F7F9FB; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:13.5px; color:#33404F }
.note.warn{ background:#FFF7EA; border-color:#F0D9B0; color:var(--warn) }
.cat-h td{ background:#F7F9FB; font-weight:800; font-size:13px; color:var(--navy) }
.pubbar{ position:fixed; inset-inline:0; bottom:0; z-index:30; background:rgba(255,255,255,.97); backdrop-filter:blur(8px); box-shadow:0 -10px 24px -12px rgba(17,27,41,.3); padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)) }
.pubbar .in{ max-width:1180px; margin:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap }
.pubbar .msg{ font-weight:700; color:var(--navy) } .pubbar .msg.dirty{ color:var(--warn) }
.pubbar .sp{ flex:1 }
.modal-bd{ position:fixed; inset:0; z-index:50; background:rgba(17,27,41,.55); display:grid; place-items:center; padding:18px }
.modal{ width:min(520px,100%); background:#fff; border-radius:22px; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.35); max-height:90vh; overflow:auto }
.code-big{ font:800 28px/1.2 ui-monospace,Consolas,monospace; letter-spacing:3px; text-align:center; padding:14px; background:#0B1F33; color:#fff; border-radius:14px; direction:ltr; margin:10px 0 }
.toast{ position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:#0B1F33; color:#fff; padding:10px 18px; border-radius:12px; font-weight:700; z-index:60; box-shadow:0 12px 28px rgba(0,0,0,.3) }
.mono{ font-family:ui-monospace,Consolas,monospace; direction:ltr; unicode-bidi:isolate }
ol.steps{ margin:6px 0 0; padding-inline-start:20px; line-height:1.9 }
@media (max-width:640px){ .hd .hd-t span, .hd small{ display:none } .hd .hd-word{ height:18px } .hd{ gap:8px; padding:10px 12px } .hd img:first-child{ width:34px; height:36px } .hd .who{ gap:6px } .hd .who .btn.sm{ padding:0 8px } .hd .who span.n{ display:none } h1{ font-size:22px } td,th{ padding:8px 5px } }
/* pilot metrics */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px }
.kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:2px }
.kpi b{ font-size:28px; font-weight:900; color:var(--navy); line-height:1.15; font-variant-numeric:tabular-nums }
.kpi b small{ font-size:15px; color:var(--muted); font-weight:700 }
.kpi span{ font-size:13px; font-weight:700; color:#33404F } .kpi em{ font-style:normal; font-size:12px; color:var(--muted) }
.seg{ display:inline-flex; background:#DCE1E7; border-radius:12px; padding:3px; gap:2px }
.seg button{ border:0; background:none; border-radius:9px; padding:6px 12px; font-weight:800; font-size:13px; color:#3F4C5B; cursor:pointer }
.seg button[aria-pressed=true]{ background:#fff; color:var(--navy); box-shadow:0 2px 6px rgba(17,27,41,.12) }
.pl-grid{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px; margin-top:14px }
@media (max-width:860px){ .pl-grid{ grid-template-columns:1fr } }
.chart svg{ width:100%; height:auto; display:block } .chart text{ font:600 10.5px Heebo,Arial,sans-serif; fill:var(--muted) }
.legend{ display:flex; gap:14px; font-size:12.5px; color:var(--muted); font-weight:700; margin-top:6px } .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:5px; vertical-align:-1px }
.adopt{ display:flex; flex-direction:column; gap:10px } .adopt .r{ display:grid; grid-template-columns:118px 1fr 64px; align-items:center; gap:10px; font-size:13.5px; font-weight:700 }
.adopt .bar{ height:10px; background:#E8ECF1; border-radius:99px; overflow:hidden } .adopt .bar i{ display:block; height:100%; background:var(--cyanS); border-radius:99px }
.adopt .r span:last-child{ text-align:end; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px }
.att{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px } .att li{ font-size:13.5px; padding:9px 12px; border-radius:12px; background:#F7F9FB; border:1px solid var(--line) }
.att li.w{ background:#FFF7EA; border-color:#F0D9B0; color:var(--warn) } .att li.b{ background:rgba(194,54,43,.06); border-color:rgba(194,54,43,.25); color:var(--bad) }
.pt th.s{ cursor:pointer; user-select:none } .pt th.s:hover{ color:var(--navy) } .pt td.n{ font-variant-numeric:tabular-nums; text-align:center } .pt th.n{ text-align:center }
.pt td .dim{ color:var(--muted); font-size:12px }
.beta{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:#fff3cd;color:#7a4f00;border:1px solid #efd27e;vertical-align:middle}
</style>
</head>

    if (cfg.backend && cfg.backend.endpoint) loadReport(true).then(function(){ toast('המפתח תואם לגיליון — אפשר לפרסם'); }, function(){ toast('המפתח נשמר, אבל הגיליון לא מזהה אותו — בדקו שהעתקתם מהקוד שמותקן'); });

var APPS_SCRIPT = "/**\n * G1 SiteGuard — הגדרות האפליקציות (מחירים, משתמשים, סקרים) + קליטת נתונים (סקרים, יומן כניסות, הזמנות) בגיליון Google.\n * הדבקה: Extensions → Apps Script → מחקו את התוכן הקיים → הדביקו את כל הקובץ → שמירה.\n * פרסום: Deploy → New deployment → Web app → Execute as: Me → Who has access: Anyone → Deploy.\n * את כתובת ה-Web app מדביקים בעמוד הניהול.\n */\nvar ADMIN_KEY = '%%ADMIN_KEY%%';          // מפתח הניהול — נגזר מקוד מנהל המוצר; כל מכשיר שנכנס עם הקוד מקבל אותו אוטומטית\nvar CONFIG_URL = 'https://yhj842dhyb-design.github.io/g1-siteguard/config.json';\n\nvar SCRIPT_VER = 3;\nfunction doPost(e) {\n  var lock = LockService.getScriptLock(), locked = false;\n  try {\n    var d = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    // settings need the lock; a log row is written even when the sheet is busy (appendRow is atomic)\n    try { lock.waitLock(d.type === 'config' ? 25000 : 8000); locked = true; } catch (le) { if (d.type === 'config' || d.type === 'setAi') return out_({ ok: false, error: 'busy' }); }\n    var ss = SpreadsheetApp.getActiveSpreadsheet();\n    var now = new Date();\n    if (d.type === 'config') {\n      if (!validKey_(d.key)) return out_({ ok: false, error: 'unauthorized' });\n      addKeys_(d.addKeys);\n      var c = d.config;\n      if (!c || typeof c !== 'object' || !c.access || !c.consumer) return out_({ ok: false, error: 'bad config' });\n      var json = JSON.stringify(c);\n      saveConfig_(ss, json);\n      var hist = sheet_(ss, 'ConfigHistory', ['time', 'by', 'json']);\n      hist.appendRow([now, safe_(String(d.by || ''))].concat(chunks_(json).map(function (x) { return 'J:' + x; })));\n      if (hist.getLastRow() > 201) hist.deleteRows(2, hist.getLastRow() - 201);   // keep the last 200 versions\n      CacheService.getScriptCache().remove('cfg'); CacheService.getScriptCache().remove('users');\n      return out_({ ok: true, savedAt: now.toISOString() });\n    }\n    if (d.type === 'setAi') {\n      if (!validKey_(d.key)) return out_({ ok: false, error: 'unauthorized' });\n      var pr = PropertiesService.getScriptProperties();\n      if (typeof d.aiKey === 'string') { if (d.aiKey) pr.setProperty('ANTHROPIC_API_KEY', d.aiKey.trim()); else pr.deleteProperty('ANTHROPIC_API_KEY'); }\n      if (d.model) pr.setProperty('AI_MODEL', String(d.model).trim());\n      if (d.dailyCap) pr.setProperty('AI_DAILY_CAP', String(parseInt(d.dailyCap, 10) || 40));\n      return out_({ ok: true, ai: !!pr.getProperty('ANTHROPIC_API_KEY') });\n    }\n    if (d.type === 'analyzePlan') {\n      if (locked) lock.releaseLock();          // long call — don't hold the sheet lock\n      if (!knownUser_(d.uid)) return out_({ ok: false, error: 'unknown user' });\n      return out_(analyzePlan_(d));\n    }\n    if (d.type === 'login') {\n      if (!knownUser_(d.uid) && !knownUser_(d.uid, true)) {\n        // not in the published user list: kept aside (not counted), so the admin page can show who tried\n        append_(ss, 'Rejected', ['time', 'event', 'uid', 'name', 'deviceId', 'device', 'appVersion'],\n          [now, d.event || '', d.uid || '', d.name || '', d.deviceId || '', d.deviceLabel || '', d.appVersion || '']);\n        var rj = ss.getSheetByName('Rejected'); if (rj && rj.getLastRow() > 1001) rj.deleteRows(2, rj.getLastRow() - 1001);\n        return out_({ ok: false, error: 'unknown user' });\n      }\n      append_(ss, 'Logins', ['time', 'event', 'uid', 'name', 'deviceId', 'device', 'appVersion'],\n        [now, d.event || '', d.uid || '', d.name || '', d.deviceId || '', d.deviceLabel || '', d.appVersion || '']);\n    } else if (d.type === 'survey') {\n      if (!knownUser_(d.uid)) return out_({ ok: false, error: 'unknown user' });\n      append_(ss, 'Responses', ['time', 'surveyId', 'uid', 'name', 'deviceId', 'answers'],\n        [now, d.surveyId || '', d.uid || '', d.name || '', d.deviceId || '', JSON.stringify(d.answers || {})]);\n      // a readable sheet per survey: one column per question\n      var ids = Object.keys(d.answers || {});\n      var sh = sheet_(ss, 'S_' + String(d.surveyId || 'survey').slice(0, 40), ['time', 'name', 'uid'].concat(ids));\n      var head = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0];\n      ids.forEach(function (q) { if (head.indexOf(q) < 0) { head.push(q); sh.getRange(1, head.length).setValue(q); } });\n      var row = head.map(function (h) { return h === 'time' ? now : h === 'name' ? (d.name || '') : h === 'uid' ? (d.uid || '') : (d.answers && d.answers[h] != null ? d.answers[h] : ''); });\n      sh.appendRow(row.map(safe_));\n    } else {\n      // orders / consultant requests from the home planner\n      append_(ss, 'Leads', ['time', 'type', 'ref', 'name', 'phone', 'email', 'city', 'message', 'data'],\n        [now, d.lead_type || d.type || '', d.ref || '', d.name || '', d.phone || '', d.email || '', d.city || '', d.message || '', d.data || '']);\n    }\n    return out_({ ok: true });\n  } catch (err) {\n    return out_({ ok: false, error: String(err) });\n  } finally {\n    try { if (locked) lock.releaseLock(); } catch (e2) {}\n  }\n}\n\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  if (p.action === 'ping') return out_({ ok: true, app: 'g1-siteguard', ver: SCRIPT_VER });\n  if (p.action === 'aiStatus') { var pp = PropertiesService.getScriptProperties(); return out_({ ok: true, ai: !!pp.getProperty('ANTHROPIC_API_KEY'), model: pp.getProperty('AI_MODEL') || AI_DEFAULT_MODEL }); }\n  if (p.action === 'config') { var cj = getConfigJson_(); return out_({ ok: true, config: cj ? JSON.parse(cj) : null }); }\n  if (!validKey_(p.key)) return out_({ ok: false, error: 'unauthorized' });\n  if (p.action === 'verify') return out_({ ok: true });\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  return out_({ ok: true, ver: SCRIPT_VER, logins: rows_(ss, 'Logins', 8000), rejected: rows_(ss, 'Rejected', 500), responses: rows_(ss, 'Responses', 5000), leads: rows_(ss, 'Leads', 1000) });\n}\n\n// ---- reading a client's floor plan with Claude (vision). The API key lives only in Script Properties.\nvar AI_DEFAULT_MODEL = 'claude-sonnet-4-6';\nvar PLAN_PROMPT = [\n  'You are an expert reader of architectural floor plans (Israeli residential and small-business plans, Hebrew labels).',\n  'Analyze the attached plan image and return ONLY one JSON object, no prose, with this shape:',\n  '{\"document_type\":\"floor_plan|site_plan|elevation|section|not_a_plan\",\"overall_confidence\":0-1,\"warnings\":[\"...\"],',\n  ' \"rooms\":[{\"name\":\"exact visible label or a short Hebrew type such as סלון/מטבח/חדר שינה/שירותים/ממ״ד/מרפסת\",\"bbox\":[x0,y0,x1,y1],\"confidence\":0-1}],',\n  ' \"openings\":[{\"kind\":\"door|window|sliding_door\",\"center\":[x,y],\"width_m\":number|null,\"exterior\":true|false,\"main_entrance\":true|false,\"confidence\":0-1}],',\n  ' \"dimensions\":[{\"text\":\"as printed\",\"value_m\":number|null,\"start\":[x,y],\"end\":[x,y],\"confidence\":0-1}],',\n  ' \"outline\":[x0,y0,x1,y1]}',\n  'Rules: coordinates are normalized to the image, 0..1, origin top-left. Each room is the axis-aligned bounding box of its interior (inside the walls), not furniture.',\n  'Never invent rooms or openings — omit what is unclear and add a warning. Keep Hebrew text exactly as printed.',\n  'Dimensions: Israeli plans print centimeters WITHOUT a unit — a plain integer such as 350 or 1100 means 3.50 m / 11.00 m; a decimal such as 3.50 is meters. Set value_m accordingly; start/end are the two ends of the dimension line. List the longest clear dimension lines first (up to 8).',\n  'If the sheet holds several drawings (several floors, sections, elevations, a site plan, a title block), read ONLY the largest floor plan and add a warning. If the drawing is rotated in the image, still give coordinates in the image as shown.',\n  'Not rooms: furniture, stairs inside a room, shafts, closets drawn as furniture. Balconies, yards and parking ARE rooms (name them מרפסת / חצר / חניה).',\n  'List openings on walls only (door swings are doors, not walls). Mark main_entrance only for the apartment/house main door. Use low confidence for anything inferred. Keep the JSON compact.'\n].join('\\n');\nfunction analyzePlan_(d) {\n  var pr = PropertiesService.getScriptProperties(), key = pr.getProperty('ANTHROPIC_API_KEY');\n  if (!key) return { ok: false, error: 'ai-not-configured' };\n  if (!d.image || String(d.image).length > 8000000 || !/^[A-Za-z0-9+\\/=]+$/.test(String(d.image).slice(0, 200))) return { ok: false, error: 'bad-image' };\n  var mime = /^image\\/(jpeg|png|webp)$/.test(String(d.mime || '')) ? d.mime : 'image/jpeg';\n  var cache = CacheService.getScriptCache(), day = 'ai_' + new Date().toISOString().slice(0, 10);\n  var used = parseInt(cache.get(day) || '0', 10), cap = parseInt(pr.getProperty('AI_DAILY_CAP') || '40', 10);\n  if (used >= cap) return { ok: false, error: 'daily-cap' };\n  cache.put(day, String(used + 1), 21600);\n  var body = { model: pr.getProperty('AI_MODEL') || AI_DEFAULT_MODEL, max_tokens: 8000, messages: [{ role: 'user', content: [\n    { type: 'image', source: { type: 'base64', media_type: mime, data: d.image } },\n    { type: 'text', text: PLAN_PROMPT }\n  ] }] };\n  function refund() { try { cache.put(day, String(Math.max(0, parseInt(cache.get(day) || '1', 10) - 1)), 21600); } catch (e) {} }\n  var res;\n  try {\n    res = UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', { method: 'post', contentType: 'application/json',\n      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01' }, payload: JSON.stringify(body), muteHttpExceptions: true });\n  } catch (e) { refund(); return { ok: false, error: 'timeout' }; }\n  var code = res.getResponseCode(), txt = res.getContentText();\n  if (code !== 200) { refund(); return { ok: false, error: 'ai-http-' + code, detail: txt.slice(0, 300) }; }\n  var j; try { j = JSON.parse(txt); } catch (e) { return { ok: false, error: 'ai-bad-json' }; }\n  if (j.stop_reason === 'max_tokens') return { ok: false, error: 'ai-truncated' };\n  var t = ((j.content || []).filter(function (b) { return b.type === 'text'; })[0] || {}).text || '';\n  var a = t.indexOf('{'), b = t.lastIndexOf('}');\n  if (a < 0 || b <= a) return { ok: false, error: 'ai-no-json' };\n  try { return { ok: true, plan: JSON.parse(t.slice(a, b + 1)), model: body.model }; } catch (e) { return { ok: false, error: 'ai-bad-json' }; }\n}\n// management keys: the one written in this code + keys of manager codes issued later (kept in Script Properties)\nfunction validKey_(k) {\n  if (!k) return false;\n  if (k === ADMIN_KEY) return true;\n  var ks = JSON.parse(PropertiesService.getScriptProperties().getProperty('keys') || '[]');\n  return ks.indexOf(k) >= 0;\n}\nfunction addKeys_(arr) {\n  if (!arr || !arr.length) return;\n  var p = PropertiesService.getScriptProperties(), ks = JSON.parse(p.getProperty('keys') || '[]');\n  arr.forEach(function (k) { if (/^[a-f0-9]{64}$/.test(String(k)) && k !== ADMIN_KEY && ks.indexOf(k) < 0) ks.push(k); });\n  p.setProperty('keys', JSON.stringify(ks.slice(-30)));\n}\nfunction knownUser_(uid, fresh) {\n  if (!uid) return false;\n  var cache = CacheService.getScriptCache(), key = 'users';\n  if (fresh) { cache.remove(key); cache.remove('cfg'); }\n  var list = cache.get(key);\n  if (!list) {\n    try {\n      var cj = getConfigJson_();\n      var cfg = JSON.parse(cj || UrlFetchApp.fetch(CONFIG_URL + '?t=' + Date.now(), { muteHttpExceptions: true }).getContentText());\n      list = JSON.stringify(((cfg.access && cfg.access.users) || []).map(function (u) { return u.id; }));\n      cache.put(key, list, 300);\n    } catch (e) { return true; }   // config unreachable: don't lose data\n  }\n  return JSON.parse(list).indexOf(uid) >= 0;\n}\n// settings JSON kept in a hidden sheet, split into cells (a cell holds up to 50,000 characters)\nfunction chunks_(s) { var a = []; for (var i = 0; i < s.length; i += 40000) a.push(s.slice(i, i + 40000)); return a.length ? a : ['']; }\nfunction saveConfig_(ss, json) {\n  var sh = ss.getSheetByName('Config');\n  if (!sh) { sh = ss.insertSheet('Config'); try { sh.hideSheet(); } catch (e) {} }\n  sh.clearContents();\n  var parts = chunks_(json);\n  sh.getRange(1, 1, parts.length, 1).setNumberFormat('@').setValues(parts.map(function (x) { return ['J:' + x]; }));\n  try { CacheService.getScriptCache().put('cfg', json, 120); } catch (e) {}\n}\nfunction getConfigJson_() {\n  var cache = CacheService.getScriptCache(), hit = cache.get('cfg');\n  if (hit) return hit;\n  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Config');\n  if (!sh || sh.getLastRow() < 1) return '';\n  var json = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(function (r) { var v = String(r[0]); return v.indexOf('J:') === 0 ? v.slice(2) : v; }).join('');\n  try { cache.put('cfg', json, 120); } catch (e) {}\n  return json;\n}\nfunction sheet_(ss, name, header) {\n  var sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(header); sh.setFrozenRows(1); sh.setRightToLeft(true); }\n  return sh;\n}\n// text that starts with = + - @ would run as a formula in the sheet: store it as plain text\nfunction safe_(v) { return (typeof v === 'string' && /^[=+\\-@\\t\\r]/.test(v)) ? \"'\" + v : v; }\nfunction append_(ss, name, header, row) { sheet_(ss, name, header).appendRow(row.map(safe_)); }\nfunction rows_(ss, name, max) {\n  var sh = ss.getSheetByName(name); if (!sh || sh.getLastRow() < 2) return [];\n  var n = sh.getLastRow() - 1, start = Math.max(2, sh.getLastRow() - max + 1);\n  var vals = sh.getRange(start, 1, sh.getLastRow() - start + 1, sh.getLastColumn()).getValues();\n  var head = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0];\n  return vals.map(function (r) { var o = {}; head.forEach(function (h, i) { o[h] = r[i] instanceof Date ? r[i].toISOString() : r[i]; }); return o; });\n}\nfunction out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n";
/* ---------- publish ---------- */
$('#btnDiscard').onclick = function(){ if (!confirm('לבטל את כל השינויים שלא פורסמו?')) return; cfg = clone(saved); render(); };
$('#btnPublish').onclick = function(){
  var ep = adminEp(cfg), k = sheetKey();
  if (!ep || !k) { tab = 'publish'; document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected', String(x.dataset.t === 'publish')); }); render(); toast(!ep ? 'קודם מחברים את עמוד הניהול לגיליון Google' : 'חסר מפתח הניהול של הגיליון בדפדפן הזה'); return; }

  if (!mine || mine.status !== 'active' || mine.hash !== me.hash) { if (!confirm('השינוי ינעל את הכניסה שלך עם הקוד הנוכחי. להמשיך?')) return; }

    .then(function(j){ if (j && j.ok) { PENDING_KEYS = []; if (PENDING_SELF) { me.dk = PENDING_SELF; PENDING_SELF = ''; GOOD_KEY = ''; try { sessionStorage.setItem('g1sg_admin_me', JSON.stringify(me)); } catch(e) {} } } return j; })
    .then(function(j){ if (!j || !j.ok) { var e = new Error(j && j.error || 'שגיאה'); e.code = j && j.error; throw e; }
      SRC = 'sheet'; PUB_FAIL = ''; saved = clone(cfg); markDirty(); toast('פורסם! המשתמשים יקבלו את העדכון בפתיחה הבאה (או תוך 20 דקות)'); render(); })
    .catch(function(e){ PUB_FAIL = e.code === 'unauthorized' ? 'הפרסום נכשל — קוד הגיליון צריך עדכון חד-פעמי (פרסום וגיבוי)' : 'הפרסום נכשל — השינויים לא נשמרו. נסו שוב'; if (e.code === 'unauthorized') { goTab('publish'); } toast(e.code === 'unauthorized' ? 'קוד הגיליון צריך עדכון חד-פעמי — ראו "פרסום וגיבוי"' : e.code === 'bad config' ? 'ההגדרות לא תקינות — לא פורסם' : ('הפרסום נכשל: ' + e.message + '. בדקו את החיבור לגיליון')); })
    .then(function(){ b.textContent = 'פרסום לכל המשתמשים'; markDirty(); });
